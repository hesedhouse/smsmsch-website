name: 설교 자동 게시

on:
  # schedule 비활성화 — 로컬 PC에서 실행으로 전환 (2026-08-25)
  # YouTube transcript API가 클라우드 IP를 차단하므로 로컬에서 실행
  # - cron: '0 0 * * 1'
  workflow_dispatch: # 수동 실행은 유지 (필요 시 테스트용)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yt-dlp youtube-transcript-api anthropic openai

      - name: Run publish script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/publish_sermon.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No new sermons to publish"
          else
            git commit -m "auto: 새 설교 말씀 게시"
            git push
          fi
